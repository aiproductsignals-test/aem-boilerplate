name: Sync email fragments from DA

# Document Authoring is where the email fragments are authored; the repo is the
# only place they render unprocessed. This job carries each published fragment
# across into email-templates/, which EDS serves byte-for-byte.
#
# The repository_dispatch trigger is the one that matters — point a DA publish
# webhook at it so a fragment renders as soon as an author publishes. The
# schedule is a safety net for a missed webhook, not the primary path.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [da-publish]
  schedule:
    # off the hour on purpose; every scheduled job in the world runs at :00
    - cron: '23 */6 * * *'

concurrency:
  group: sync-da-fragments
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Pull fragments from Document Authoring
        env:
          # Preferred: IMS technical account. A DA session token carries
          # expires_in: 86400000, so a pasted DA_TOKEN dies within a day and
          # every scheduled run after that fails.
          DA_CLIENT_ID: ${{ secrets.DA_CLIENT_ID }}
          DA_CLIENT_SECRET: ${{ secrets.DA_CLIENT_SECRET }}
          DA_IMS_SCOPE: ${{ vars.DA_IMS_SCOPE }}
          # Escape hatch for a manual run only.
          DA_TOKEN: ${{ secrets.DA_TOKEN }}
          DA_ORG: ${{ vars.DA_ORG || 'aiproductsignals-test' }}
          DA_REPO: ${{ vars.DA_REPO || 'aem-boilerplate' }}
        run: node tools/sync-da-fragments.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain email-templates)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email-templates
          git commit -m "Sync email fragments from Document Authoring

          Generated by .github/workflows/sync-da-fragments.yaml.
          Source of truth is DA at /fragments/emails/ — edit there, not here."
          git push
