name: Sync email fragments from DA (DORMANT)

# DORMANT ON PURPOSE. Do not add automatic triggers back without reading this.
#
# This job was built to carry fragments from Document Authoring into
# email-templates/. It works — 13 of 14 fragments round-tripped byte-identical
# when it was tested. It is switched off because its *source* is not reliable.
#
# DA stores content in its own model, and it rewrites an email left in it. A
# fragment published at 8,998 bytes came back as 211 bytes: table shell gone,
# `<main><div>` in its place, the wordmark reinterpreted as a block name. Three
# of fourteen were destroyed within an hour, including one that had been
# restored, and the count was climbing. Opening a fragment in the da.live
# editor appears to be enough to trigger it.
#
# email-templates/ is therefore the source of truth, edited in git. If this job
# ran on a schedule it would overwrite those hand edits with whatever DA holds
# — which for an untouched fragment is the old copy, and for a touched one is
# rubble. The shape check in tools/sync-da-fragments.mjs blocks the rubble; it
# cannot tell a stale DA copy from an intentional git edit.
#
# Left runnable by hand so the machinery is one click away if DA ever holds
# these properly, or if the emails move to an EDS block that DA *can* store.

on:
  workflow_dispatch:

concurrency:
  group: sync-da-fragments
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Pull fragments from Document Authoring
        env:
          # Preferred: IMS technical account. A DA session token carries
          # expires_in: 86400000, so a pasted DA_TOKEN dies within a day and
          # every scheduled run after that fails.
          DA_CLIENT_ID: ${{ secrets.DA_CLIENT_ID }}
          DA_CLIENT_SECRET: ${{ secrets.DA_CLIENT_SECRET }}
          DA_IMS_SCOPE: ${{ vars.DA_IMS_SCOPE }}
          # Escape hatch for a manual run only.
          DA_TOKEN: ${{ secrets.DA_TOKEN }}
          DA_ORG: ${{ vars.DA_ORG || 'aiproductsignals-test' }}
          DA_REPO: ${{ vars.DA_REPO || 'aem-boilerplate' }}
        run: node tools/sync-da-fragments.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain email-templates)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email-templates
          git commit -m "Sync email fragments from Document Authoring

          Generated by .github/workflows/sync-da-fragments.yaml.
          Source of truth is DA at /fragments/emails/ — edit there, not here."
          git push
